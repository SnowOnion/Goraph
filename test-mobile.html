<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    .status { font-size: 14px; margin-bottom: 12px; padding: 8px 16px; background: #16213e; border-radius: 8px; }
    .btn { padding: 14px 24px; border-radius: 12px; background: #0f3460; color: #ccc; font-size: 15px; border: none; cursor: pointer; margin: 4px; touch-action: manipulation; }
    .btn:active { transform: scale(0.95); }
    .btn.primary { background: #e94560; }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .log { font-size: 12px; color: #888; margin-top: 16px; max-width: 400px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Mobile Test</h1>
  <div class="status" id="status">Loading...</div>
  <div>
    <button class="btn" id="pass">PASS</button>
    <button class="btn" id="restart">Restart</button>
  </div>
  <div class="log" id="log"></div>
  <script>
    const ws = new WebSocket('ws://localhost:9222/devtools/page/' + (await fetch('http://localhost:9222/json').then(r => r.json()))[0].id);
    await new Promise(resolve => ws.onopen = resolve);

    function send(method, params = {}) {
      return new Promise(resolve => {
        const id = Math.floor(Math.random() * 100000);
        ws.onmessage = e => {
          const msg = JSON.parse(e.data);
          if (msg.id === id) resolve(msg.result);
        };
        ws.send(JSON.stringify({ id, method, params }));
      });
    }

    function click(btn) {
      btn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      btn.dispatchEvent(new TouchEvent('touchstart', { bubbles: true }));
      btn.dispatchEvent(new TouchEvent('touchend', { bubbles: true }));
    }

    const log = (msg) => {
      document.getElementById('log').textContent += msg + '\n';
    };

    // Navigate to the page
    await send('Page.navigate', { url: 'http://localhost:10086/index.html' });
    await new Promise(r => setTimeout(r, 2000));

    // Check PASS button
    const passBtn = await send('Runtime.evaluate', {
      expression: `(() => {
        const btns = document.querySelectorAll('.action-btn');
        for (const b of btns) {
          if (b.textContent.includes('PASS')) return { found: true, disabled: b.classList.contains('disabled') };
        }
        return { found: false };
      })()`,
      returnByValue: true,
    });

    log('PASS button: ' + JSON.stringify(passBtn.result.value));
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#f5f0e8"/>
  <g transform="translate(256,256)">
    <!-- 围棋棋盘图案 -->
    <circle r="180" fill="none" stroke="#333" stroke-width="2"/>
    <!-- 网格线 -->
    <line x1="-140" y1="-140" x2="140" y2="-140" stroke="#333" stroke-width="1.5"/>
    <line x1="-140" y1="-70" x2="140" y2="-70" stroke="#333" stroke-width="1.5"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#333" stroke-width="1.5"/>
    <line x1="-140" y1="70" x2="140" y2="70" stroke="#333" stroke-width="1.5"/>
    <line x1="-140" y1="140" x2="140" y2="140" stroke="#333" stroke-width="1.5"/>
    <line x1="-140" y1="-140" x2="-140" y2="140" stroke="#333" stroke-width="1.5"/>
    <line x1="-70" y1="-140" x2="-70" y2="140" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#333" stroke-width="1.5"/>
    <line x1="70" y1="-140" x2="70" y2="140" stroke="#333" stroke-width="1.5"/>
    <line x1="140" y1="-140" x2="140" y2="140" stroke="#333" stroke-width="1.5"/>
    <!-- 棋子 -->
    <circle cx="-70" cy="-70" r="18" fill="#111"/>
    <circle cx="70" cy="-70" r="18" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <circle cx="0" cy="0" r="18" fill="#111"/>
    <circle cx="-70" cy="70" r="18" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <circle cx="70" cy="70" r="18" fill="#111"/>
  </g>
</svg>
